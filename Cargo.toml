[package]
name = "obscura"
version = "1.0.0"
edition = "2024"
authors = ["Naufal Ziyaadaturrahman"]
description = "Obscura: Post-Quantum Anonymous WebAuthn Credential Protocol — A privacy-preserving, lattice-based ZK authentication engine with Module-LWE proofs via Fiat-Shamir with Aborts."
license = "MIT"
repository = "https://github.com/aleshnatt/obscura"
keywords = ["webauthn", "fido2", "zero-knowledge", "privacy", "post-quantum"]
categories = ["cryptography", "authentication"]

[dependencies]
# Post-quantum cryptographic hash (SHAKE-256)
sha3 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
rand = "0.8"
thiserror = "1.0"
hex = "0.4"
clap = { version = "4.0", features = ["derive"] }
