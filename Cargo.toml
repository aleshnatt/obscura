[package]
name = "obscura"
version = "0.1.0"
edition = "2024"
authors = ["Naufal Ziyaadaturrahman"]
description = "Lattice-based credential authorization with Module-LWE-style proofs and SHAKE-256 Merkle membership."
license = "MIT"
readme = "README.md"
repository = "https://github.com/aleshnatt/obscura"
keywords = ["webauthn", "fido2", "zero-knowledge", "privacy", "lattice"]
categories = ["cryptography", "authentication"]
exclude = [".DS_Store"]

[dependencies]
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
