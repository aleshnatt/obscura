[package]
name = "obscura"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Naufal Ziyaadaturrahman <naufal@aleshnatt.com>"]
description = "Lattice-based credential authorization with Merkle membership proofs."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/aleshnatt/obscura"
homepage = "https://github.com/aleshnatt/obscura"
documentation = "https://docs.rs/obscura"
keywords = ["credentials", "authorization", "lattice", "merkle", "privacy"]
categories = ["cryptography"]
exclude = ["paper/", "whitepaper/", ".github/", ".DS_Store", "scratch.rs", "Cargo.lock"]

[dependencies]
sha3 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
